# Server
server.port=8080
spring.application.name=vehiculos-api

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/vehiculos_db
# Si usas MongoDB Atlas:
# spring.data.mongodb.uri=mongodb+srv://usuario:contraseña@cluster.mongodb.net/vehiculos_db

# Logging
logging.level.root=INFO
logging.level.com.vehiculos=DEBUG

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html